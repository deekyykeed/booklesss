    var cs=Math.min(paneW/PANE_W,vh/CONTENT_H);
    var gapL=1*cs, mT=14*cs, mB=13*cs, mR=14*cs;
    var cw=Math.max(CARD_W*cs,paneW-gapL-mR);
    var ch=vh-mT-mB;
    var s=card.style;
    s.left=gapL+'px';s.top=mT+'px';s.width=cw+'px';s.height=ch+'px';
    s.borderRadius=(26*cs)+'px';s.borderWidth=Math.max(1,cs)+'px';
    cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
    stage.style.setProperty('--cs',cs);
  }

  function seatHero(photoW,vh){
    var bandH=vh;
    var imgScale=Math.max(photoW/IMG_W,bandH/IMG_H);
    var s=Math.min(imgScale/IMG_REF_SCALE,photoW*0.92/HERO_W);
    hero.style.bottom='0px';
    hero.style.transform='scale('+s+')';
  }

  function headlineMeasure(){
    var cs=getComputedStyle(hl1);
    var probe=document.createElement('span');
    probe.textContent='Find Signal to Action Instantly';
    probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0;'+
      'font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';font-weight:'+cs.fontWeight+';'+
      'letter-spacing:'+cs.letterSpacing+';word-spacing:'+cs.wordSpacing+';'+
      'font-variation-settings:'+cs.fontVariationSettings+';';
    document.body.appendChild(probe);
    var w=probe.getBoundingClientRect().width;
    probe.remove();
    return w;
  }

  function layout(){
    var vw=window.innerWidth, vh=window.innerHeight;
    if(mqLandscape.matches){
      setMode('land');
      var pw=Math.round(vw*photoRatio(vw));
      photo.style.width=pw+'px';
      pane.style.left=pw+'px';
      placeCard(vw-pw,vh);
      seatHero(pw,vh);
    }else if(mqPortrait.matches){
      setMode('tabport');
      var band=Math.round(vh*0.425);
      var side=Math.round(vw*0.0525);
      var foot=Math.round(vh*0.0297);
      var st=stage.style;
      st.setProperty('--band-h',band+'px');
      st.setProperty('--tp-side',side+'px');
      st.setProperty('--tp-foot',foot+'px');
      st.setProperty('--tp-card-top',Math.round(side*0.6)+'px');
      st.setProperty('--badge-k',(band*TP.badgeH/37).toFixed(4));
      st.setProperty('--tp-hero-lh',TP.heroLh);
      /* heroGap: the spec's -0.30423 x band put the headline on top of the
         badge (about -187px on a 1448px-tall tablet), so the badge-to-
         headline space is a small positive share of the band instead. */
      st.setProperty('--tp-hero-gap',Math.round(band*0.022)+'px');
      Object.keys(BAND).forEach(function(k){st.setProperty(kebab(k),(band*TP[k]).toFixed(2)+'px');});
      /* The card is laid out by CSS from those vars; measure it, then write
         its interior. */
      var r=card.getBoundingClientRect();
      var cw=r.width, ch=r.height, S=Math.min(ch,cw*REF_CARD_ASPECT);
      Object.keys(TP).forEach(function(k){
        if(BAND[k]||k==='heroLh'||k==='heroGap')return;
        var base=VERTICAL[k]?ch:WIDTH[k]?cw:S;
        st.setProperty(kebab(k),(base*TP[k]).toFixed(2)+'px');
      });
      st.setProperty('--hl-measure',Math.round(headlineMeasure()*0.61)+'px');
    }else{
      setMode('phone');
    }
  }

  window.addEventListener('resize',layout,{passive:true});
  window.addEventListener('orientationchange',layout);
  [mqLandscape,mqPortrait].forEach(function(mq){
    if(mq.addEventListener)mq.addEventListener('change',layout);else mq.addListener(layout);
  });
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  layout();
})();

(function(){
  var root=document.documentElement;
  function releaseEntrance(){
    root.classList.remove('entry-pending');
    clearTimeout(window.__entryFallback);
  }
  var reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduced||!Element.prototype.animate){releaseEntrance();return;}

  var ease='cubic-bezier(.16,1,.3,1)';
  var softEase='cubic-bezier(.22,1,.36,1)';
  var compact=window.matchMedia('(max-width:699px)').matches;
  var hlY=compact?'translateY(12px)':'translateY(16px)';

  var steps=[
    ['.card',40,820,ease,{opacity:0,transform:compact?'translateY(14px)':'translateY(12px) scale(.988)'}],
    ['.badge',120,480,softEase,{opacity:0,transform:'translateY(8px)'}],
    ['#hl1',240,760,ease,{opacity:0,transform:hlY,clipPath:'inset(100% 0 0 0)'},true],
    ['#hl2',330,760,ease,{opacity:0,transform:hlY,clipPath:'inset(100% 0 0 0)'},true],
    ['#h1',470,620,ease,{opacity:0,transform:'translateY(10px)'}],
    ['#sub',570,560,ease,{opacity:0,transform:'translateY(10px)'}],
    ['#email',720,520,softEase,{opacity:0,transform:'translateY(8px)'}],
    ['#pw',790,520,softEase,{opacity:0,transform:'translateY(8px)'}],
    ['#loginBtn',930,560,ease,{opacity:0,transform:'translateY(8px)'}],
    ['.divider',1060,440,softEase,{opacity:0,transform:'translateY(6px)'}],
    ['#gBtn',1150,540,ease,{opacity:0,transform:'translateY(8px)'}],
    ['#bottom',1260,500,softEase,{opacity:0,transform:'translateY(6px)'}]
  ];

  function run(){
    var animations=[];
    steps.forEach(function(s){
      var el=document.querySelector(s[0]);
      if(!el)return;
      var to={opacity:1,transform:'none'};
      if(s[5])to.clipPath='inset(0 0 0 0)';
      animations.push(el.animate([s[4],to],{delay:s[1],duration:s[2],easing:s[3],fill:'both'}));
    });
    /* The animations now own the hidden first frame, so the CSS guard can
       drop without a flash. */
    root.classList.remove('entry-pending');
    Promise.allSettled(animations.map(function(a){return a.finished;})).then(function(){
      animations.forEach(function(a){a.cancel();});
      animations.length=0;
      releaseEntrance();
    });
  }

  var fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([fontsReady,new Promise(function(r){setTimeout(r,650);})]).then(function(){
    requestAnimationFrame(function(){requestAnimationFrame(run);});
  });
})();
</script>
