<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- The course-home banner: the app's wave backdrop, held still. Same
       195-225 hues as .bg-waves so the image reads as part of the room. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2fa"/>
      <stop offset="1" stop-color="#dde6f5"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5f5"/>
      <stop offset="1" stop-color="#b9c9ee"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3c4e6"/>
      <stop offset="1" stop-color="#9fb4de"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba4d4"/>
      <stop offset="1" stop-color="#7b95c8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#sky)"/>
  <circle cx="985" cy="70" r="38" fill="#f7f9fd" opacity="0.9"/>
  <path d="M0 208 C 150 168, 285 168, 430 205 S 720 268, 900 228 S 1120 168, 1200 182 L 1200 340 L 0 340 Z" fill="url(#w1)"/>
  <path d="M0 252 C 180 218, 330 216, 505 248 S 800 300, 980 262 S 1140 218, 1200 230 L 1200 340 L 0 340 Z" fill="url(#w2)" opacity="0.92"/>
  <path d="M0 300 C 210 272, 400 270, 600 294 S 950 330, 1200 292 L 1200 340 L 0 340 Z" fill="url(#w3)" opacity="0.95"/>
  <path d="M0 214 C 150 174, 285 174, 430 211 S 720 274, 900 234 S 1120 174, 1200 188" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <path d="M0 258 C 180 224, 330 222, 505 254 S 800 306, 980 268 S 1140 224, 1200 236" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
</svg>
